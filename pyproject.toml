[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nis2-document-auditor"
version = "0.2.0"
description = "Local, evidence-first NIS2 document audit prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "pymupdf>=1.26.7,<1.27",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
  "platformdirs>=4,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
nis2-auditor = "nis2_auditor.cli:main"

[tool.setuptools.packages.find]
include = ["nis2_auditor*"]

[tool.setuptools.package-data]
nis2_auditor = ["static/*", "catalog_data/*.json"]
